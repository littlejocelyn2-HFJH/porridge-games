<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>以粥養生・閱讀小誌</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lxgw-wenkai-tc@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lxgw-wenkai-tc@5/700.css">
<link rel="stylesheet" href="style.css?v=22">
<script src="config.js?v=2"></script>
<script src="content.js?v=18"></script>
<script src="art.js?v=4"></script>
</head>
<body>
<header class="masthead noprint" id="masthead">
  <span class="brand" id="brand">以粥養生<small>閱讀小誌</small></span>
  <span class="sp"></span>
  <span class="chmarks" id="chmarks"></span>
  <span class="who" id="who"></span>
</header>

<main id="pg-home" class="page hidden"></main>
<main id="pg-ch" class="page hidden"></main>
<main id="pg-report" class="page hidden"></main>
<main id="pg-scores" class="page hidden"></main>
<main id="pg-screen" class="hidden"></main>

<div class="mask hidden" id="regMask">
  <form class="card" id="regForm" autocomplete="off">
    <h2>借閱登記</h2>
    <div class="small muted">寫下班級、座號和姓名，這台裝置下次會記得你。</div>
    <label>班級</label><input id="rCls" inputmode="numeric" placeholder="例如 902" maxlength="3">
    <label>座號</label><input id="rSeat" inputmode="numeric" placeholder="例如 12" maxlength="2">
    <label>姓名</label><input id="rName" placeholder="你的名字" maxlength="20">
    <div class="err" id="regErr"></div>
    <div class="btnrow" style="margin-top:6px"><button class="btn solid" type="submit" style="flex:1">翻開小誌</button></div>
    <p class="small" style="text-align:center;margin:14px 0 0"><a href="#scores" id="teacherSkip">我是老師，先略過，直接看班級成績 →</a></p>
  </form>
</div>
<div class="bigstamp" id="bigstamp"></div>

<script>
(function(){
"use strict";
const CFG = window.PZ_CONFIG || {}, API = (CFG.sheetApi || "").trim();
const Z = window.ZINE, CH = {}; Z.chapters.forEach(c => CH[c.no] = c);
const NOS = Z.chapters.map(c => c.no), NCH = NOS.length;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = { get(k,d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const SS = { get(k){ try{ return sessionStorage.getItem(k) || ""; }catch(e){ return ""; } }, set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }, del(k){ try{ sessionStorage.removeItem(k); }catch(e){} } };
const normSeat = s => { const n = parseInt(String(s).replace(/[^\d]/g,""),10); return isNaN(n) ? "" : String(n); };
const toast = m => { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
const fmtDur = s => { s = Math.round(s || 0); return s >= 60 ? `${Math.floor(s/60)} 分 ${s%60} 秒` : `${s} 秒`; };
const fmtTime = iso => { const d = new Date(iso); if(isNaN(d)) return ""; const p = n => String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const pct = (a,b) => b ? Math.round(a * 100 / b) : 0;
document.body.insertAdjacentHTML("afterbegin", Art.defs());

async function api(payload){
  if(!API) return { ok:false, local:true, error:"本機模式：還沒設定後端，無法批改" };
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

/* ================= 學生與練習紀錄 ================= */
const PREVIEW = () => SS.get("pz_preview") === "1";
let student = PREVIEW() ? { cls:"999", seat:"1", name:"老師預覽" } : LS.get("pz_student", null);
const sessKey = () => PREVIEW() ? "pz_sess_preview" : student ? `pz_sess_${student.cls}_${student.seat}` : "";
let sess = student ? LS.get(sessKey(), null) : null;
function startPreview(no, fresh){
  SS.set("pz_preview", "1"); student = { cls:"999", seat:"1", name:"老師預覽" };
  if(fresh) LS.del("pz_sess_preview");
  sess = LS.get("pz_sess_preview", null); location.hash = "#ch" + no; route();
}
function endPreview(){
  SS.del("pz_preview"); student = LS.get("pz_student", null); sess = student ? LS.get(sessKey(), null) : null; location.hash = "#scores";
}
const saveLocal = () => { if(sess) LS.set(sessKey(), sess); };
function L(no){ sess.levels[no] = sess.levels[no] || { tries:[], dur:0, hints:0, place:{}, locked:{}, notes:{}, revealed:{}, order:null, fill:"", reflect:"" }; return sess.levels[no]; }
const chDone = no => !!(sess && sess.levels[no] && sess.levels[no].done);

async function ensureSession(){
  if(sess && sess.id) return;
  sess = { id: new Date().toISOString() + "_" + Math.random().toString(36).slice(2,6), start: new Date().toISOString(), mode:"standard", pretest:null, paraHints:null, levels:{}, graded:{} };
  saveLocal();
  try{
    const r = await api({ action:"start", student });
    if(r.ok){ sess.mode = r.mode; sess.pretest = r.pretest; sess.paraHints = r.paraHints || null; saveLocal(); }
  }catch(e){}
}

/* ================= 頁首 ================= */
function renderMast(cur){
  if(PREVIEW()){ $("#who").innerHTML = `<span class="tag">老師預覽中・不存紀錄</span> <button class="textlink" id="endPrev">結束預覽</button>`; $("#endPrev").onclick = endPreview; }
  else $("#who").textContent = student ? `${student.cls} 班 ${student.seat} 號 ${student.name}` : "";
  $("#chmarks").innerHTML = student && sess ? Z.chapters.map(c => `<span class="${chDone(c.no) ? "done" : ""} ${cur === c.no ? "cur" : ""}" title="第${c.kanji}話">${c.kanji}</span>`).join("") : "";
}
$("#brand").onclick = () => { location.hash = "#"; };

/* ================= 封面 ================= */
function renderHome(){
  const done = sess ? Z.chapters.filter(c => chDone(c.no)).length : 0;
  let h = `<section class="cover">
    <div class="vol">${esc(Z.vol)}　・　韓良憶〈以粥養生〉</div>
    <h1>${esc(Z.title)}</h1>
    <div class="sub">${esc(Z.sub)}</div>
    <div class="still-wrap">${Art.stillLife()}</div>
    ${Art.table(680)}
  </section>`;
  if(student) h += `<div class="greet">${esc(student.name)}，歡迎回來。${done ? `已經讀完 ${done} 話了。` : "從第一話開始吧。"}</div>`;
  h += `<nav class="toc"><h3>目　次</h3>` + Z.chapters.map(c => {
    const st = chDone(c.no) ? `<span class="st ok">讀完了 ✓</span>` : `<span class="st">p.${c.no * 4 - 2}</span>`;
    return `<a href="#ch${c.no}" data-ch="${c.no}"><span class="k">第${c.kanji}話</span><span class="t">${esc(c.title)}</span><span class="dots"></span>${st}</a>`;
  }).join("") + `</nav>`;
  h += `<div class="btnrow">
      <a class="btn solid" href="#ch${nextCh()}">${done ? (done === NCH ? "再翻一次" : "繼續讀下去") : "翻開小誌"}</a>
      ${done === NCH ? `<a class="btn" href="#report">我的讀書手帖</a>` : ""}
      <a class="btn" href="#scores">老師入口</a>
      ${student ? `<button class="textlink" id="notMe">不是我？重新登記</button>` : ""}
    </div>
    <p class="small muted" style="margin-top:26px">這本小誌是看完前測之後的練習。每一話都可以慢慢來，答錯了也沒關係，會有小紙條提醒你回課文找。</p>`;
  $("#pg-home").innerHTML = h;
  const nm = $("#notMe"); if(nm) nm.onclick = () => openReg(true);
}
const nextCh = () => { for(const c of Z.chapters) if(!chDone(c.no)) return c.no; return 1; };

/* ================= 登記 ================= */
let afterReg = null;
function openReg(force){
  $("#rCls").value = student && !force ? student.cls : ""; $("#rSeat").value = student && !force ? student.seat : ""; $("#rName").value = "";
  $("#regErr").textContent = ""; $("#regMask").classList.remove("hidden");
}
$("#regForm").onsubmit = e => {
  e.preventDefault();
  const cls = $("#rCls").value.trim(), seat = normSeat($("#rSeat").value), name = $("#rName").value.trim();
  if(!/^\d{3}$/.test(cls)) return $("#regErr").textContent = "班級請寫三位數字，例如 902";
  if(!(Number(seat) >= 1 && Number(seat) <= 60)) return $("#regErr").textContent = "座號請寫 1～60";
  if(!name) return $("#regErr").textContent = "請寫上姓名";
  student = { cls, seat, name }; LS.set("pz_student", student);
  sess = LS.get(sessKey(), null);
  $("#regMask").classList.add("hidden");
  if(afterReg){ const f = afterReg; afterReg = null; f(); } else route();
};
$("#teacherSkip").onclick = () => $("#regMask").classList.add("hidden");

/* ================= 拖曳與點選 ================= */
let selId = null, drag = null;
function bindDrag(root, opt){
  root.querySelectorAll(".slip[data-id]").forEach(el => {
    if(el.classList.contains("locked")) return;
    el.addEventListener("pointerdown", e => {
      if(e.button > 0) return;
      drag = { id: el.dataset.id, el, x: e.clientX, y: e.clientY, active:false, ghost:null, opt };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", e => {
      if(!drag || drag.el !== el) return;
      if(!drag.active && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7){
        drag.active = true;
        const r = el.getBoundingClientRect(), g = el.cloneNode(true);
        g.classList.add("ghost"); g.style.width = r.width + "px"; g.style.left = r.left + "px"; g.style.top = r.top + "px";
        drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top; document.body.appendChild(g); drag.ghost = g; el.style.opacity = .3;
      }
      if(drag.active){
        drag.ghost.style.left = (e.clientX - drag.dx) + "px"; drag.ghost.style.top = (e.clientY - drag.dy) + "px";
        document.querySelectorAll(".over").forEach(z => z.classList.remove("over"));
        const t = document.elementFromPoint(e.clientX, e.clientY), z = t && t.closest("[data-zone]");
        if(z) z.classList.add("over");
        if(opt.onMove) opt.onMove(drag.id, e.clientY);
        if(e.clientY > window.innerHeight - 70) window.scrollBy(0, 14); else if(e.clientY < 70) window.scrollBy(0, -14);
      }
    });
    const end = e => {
      if(!drag || drag.el !== el) return;
      const d = drag; drag = null;
      document.querySelectorAll(".over").forEach(z => z.classList.remove("over"));
      if(d.active){
        d.ghost.remove(); el.style.opacity = "";
        const t = document.elementFromPoint(e.clientX, e.clientY);
        const z = t && t.closest("[data-zone]");
        opt.onDrop(d.id, z ? z.dataset.zone : (t && t.closest(".tray") ? "tray" : null), e.clientY);
      } else opt.onTap(d.id);
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", e => { if(drag && drag.ghost) drag.ghost.remove(); if(drag) drag.el.style.opacity = ""; drag = null; });
  });
  root.querySelectorAll("[data-zone]").forEach(z => z.addEventListener("click", e => {
    const sl = e.target.closest(".slip"); if(sl && !sl.classList.contains("locked")) return;
    if(selId){ const id = selId; selId = null; opt.onDrop(id, z.dataset.zone); }
  }));
}

/* ================= 章節 ================= */
let curNo = 0, tOpen = 0;
function flushTime(){ if(curNo && sess && tOpen){ const l = L(curNo); if(!l.done){ l.dur += Math.round((Date.now() - tOpen) / 1000); saveLocal(); } } tOpen = 0; }

function slipHTML(c, l, no){
  const para = sess.mode === "support" && l.tries.length && sess.paraHints && sess.paraHints[no] ? sess.paraHints[no][c.id] : "";
  const cls = ["slip", l.locked[c.id] ? "locked" : "", l.revealed[c.id] ? "revealed" : "", selId === c.id ? "sel" : ""].join(" ");
  const note = l.notes[c.id];
  return `<div class="${cls}" data-id="${c.id}">${esc(c.t)}${para && !l.locked[c.id] ? `<span class="para">✎ ${esc(para)}</span>` : ""}${note === "✓" ? `<span class="mark">✓</span>` : note ? `<span class="why">${esc(note)}</span>` : ""}</div>`;
}

function renderCh(no){
  const c = CH[no], l = L(no);
  curNo = no; renderMast(no);
  if(!l.done && !tOpen) tOpen = Date.now();
  let h = `<div class="kicker">第${c.kanji}話　${esc(c.kicker)}</div>
    <h1 class="title"><span class="no">${c.kanji}</span>${esc(c.title)}</h1>
    <p class="lead">${esc(c.lead)}</p>`;
  if(sess.mode === "support" && no === 1) h += `<p class="note">✎ 先自己放放看。交出去之後，還沒放對的紙片會標出段落，幫你回課文找。</p>`;
  if(sess.mode === "challenge" && (c.kind === "sort" || c.kind === "slots")) h += `<p class="note">✎ 小老師任務：這次沒有段落提示，挑戰一次就放對！</p>`;
  if(!API) h += `<p class="note">※ 本機模式：還沒設定後端，可以看看版面，但不能批改。</p>`;
  h += `<div id="work"></div><div class="feedback" id="fb"></div><div class="actions" id="acts"></div><div id="after"></div>`;
  $("#pg-ch").innerHTML = h;
  renderWork(no);
  renderAfter(no);
  window.scrollTo({ top:0 });
}

function renderWork(no){
  const c = CH[no], l = L(no), w = $("#work");
  if(c.kind === "order") return renderOrder(no);
  if(c.kind === "compare"){ l.cardsDone = true; w.innerHTML = versionsHTML(c); $("#acts").innerHTML = ""; return; }
  if(c.kind === "write"){ if(!l.done && l.tries.some(Array.isArray)){ l.tries = []; l.firstRight = null; } l.cardsDone = true; w.innerHTML = sceneHTML(c); $("#acts").innerHTML = ""; return; }
  const inTray = c.cards.filter(k => !l.place[k.id]);
  const compact = window.innerWidth < 700;
  let h = "";
  const trayHTML = (empty) => {
    if(!compact) return `<div class="tray">${inTray.map(k => slipHTML(k, l, no)).join("") || `<span class="small muted">${empty}</span>`}</div>`;
    if(!inTray.length){ selId = null; return `<div class="hand empty"><span class="small muted">${empty}</span></div>`; }
    l.hand = Math.min(l.hand || 0, inTray.length - 1);
    const cur = inTray[l.hand]; selId = cur.id;
    return `<div class="hand"><div class="hand-top"><span>✂ 手上的紙片</span><span>${l.hand + 1}／${inTray.length}</span></div>
      <div class="hand-row"><button class="hbtn" data-hand="-1" aria-label="上一張" ${inTray.length < 2 ? "disabled" : ""}>‹</button>${slipHTML(cur, l, no).replace('class="slip', 'class="slip inhand')}<button class="hbtn" data-hand="1" aria-label="下一張" ${inTray.length < 2 ? "disabled" : ""}>›</button></div>
      <div class="small muted" style="text-align:center">點下面的${no === 1 ? "碗" : c.kind === "photo" ? "照片" : c.kind === "tline" ? "時間點" : c.kind === "slots" ? "欄位" : "盤子"}，把紙片放進去</div></div>`;
  };
  if(c.kind === "sort" && no === 1){
    h += trayHTML("紙片都放好了。");
    h += `<div class="tablezone"><div class="bowls">` + c.zones.map(z => `<div class="zone" data-zone="${z.id}">
        <div class="who${Array.isArray(z.who) ? " pair" : ""}">${[].concat(z.who).map(w => Art.portrait(w, { size:false })).join("")}</div>
        <div class="bowlart">${Art.bowl(z.bowl, { size:false })}</div>
        <div class="zlabel">${esc(z.label)}</div><div class="znote">${esc(z.note)}</div>
        <div class="drop">${c.cards.filter(k => l.place[k.id] === z.id).map(k => slipHTML(k, l, no)).join("")}</div></div>`).join("") + `</div>${Art.table(700)}</div>`;
  } else if(c.kind === "sort"){
    h += trayHTML("紙片都放好了。");
    h += `<div class="bowls two">` + c.zones.map(z => `<div class="zone" data-zone="${z.id}" style="border-top:1.5px solid var(--ink)">
        <div class="zstamp">${Art.stamp(z.stamp, { width:60, c: z.id === "enough" ? "#5f7055" : "#b5523b" })}</div>
        <div class="zlabel">${esc(z.label)}</div>
        <div class="drop">${c.cards.filter(k => l.place[k.id] === z.id).map(k => slipHTML(k, l, no)).join("")}</div></div>`).join("") + `</div>`;
  } else if(c.kind === "tline"){
    h += trayHTML("都放好了。");
    if(l.cardsDone && !l.tlref && !l.tlBusy && API){ l.tlBusy = true; api({ action:"check", set:"c" + no + "tl", written:{} }).then(r => { l.tlBusy = false; l.tlref = r.ok && r.ref ? r.ref : {}; saveLocal(); if(curNo === no) renderWork(no); }).catch(() => { l.tlBusy = false; }); }
    h += `<div class="htl"><div class="htl-ax"><span class="htl-end">古</span><span class="htl-line"></span><span class="htl-end">今</span></div><div class="htl-pts">` + c.zones.map(z => { const k = c.cards.find(x => l.place[x.id] === z.id);
      return `<div class="htl-pt zone" data-zone="${z.id}"><span class="htl-dot"></span><div class="lab">${esc(z.label)}</div>${l.cardsDone && k && l.tlref && l.tlref[k.id] ? `<div class="htl-era">${esc(l.tlref[k.id])}</div>` : ""}<div class="drop">${k ? slipHTML(k, l, no) : `<span class="small muted">放到這裡</span>`}</div></div>`; }).join("") + `</div></div>`;
  } else if(c.kind === "photo"){
    h += trayHTML("國家都放好了。");
    h += `<div class="photos">` + c.zones.map(z => { const k = c.cards.find(x => l.place[x.id] === z.id), ok = k && l.locked[k.id];
      return `<figure class="photo zone" data-zone="${z.id}"><img src="${z.img}" alt="${esc(z.label)}" loading="lazy" draggable="false">
        <figcaption><span class="plab">${esc(z.label)}</span><div class="drop">${k ? slipHTML(k, l, no) : `<span class="small muted">把國家放到這裡</span>`}</div>${ok ? `<div class="pnote">${esc(z.note)}</div>` : ""}</figcaption></figure>`; }).join("") + `</div>`;
  } else if(c.kind === "slots"){
    h += trayHTML("紙片都貼好了。");
    h += `<div class="slots">` + c.zones.map(z => `<div class="slotrow" data-zone="${z.id}"><div class="lab">${z.label}<small>${esc(z.note)}</small></div>
        <div class="drop">${c.cards.filter(k => l.place[k.id] === z.id).map(k => slipHTML(k, l, no)).join("")}</div></div>`).join("") + `</div>`;
  }
  w.innerHTML = h;
  w.querySelectorAll("[data-hand]").forEach(b => b.onclick = () => { const n = inTray.length; l.hand = ((l.hand || 0) + Number(b.dataset.hand) + n) % n; renderWork(no); });
  w.querySelectorAll(".tray").forEach(t => t.addEventListener("click", e => { if(!e.target.closest(".slip") && selId && l.place[selId] && !l.locked[selId]){ delete l.place[selId]; selId = null; saveLocal(); renderWork(no); } }));
  const this_drop = (id, zone) => {
      if(l.locked[id]) return;
      if(zone && zone !== "tray"){
        if((c.kind === "slots" || c.kind === "photo" || c.kind === "tline") && Object.keys(l.place).some(k => l.place[k] === zone && l.locked[k])) return;
        if(c.kind === "slots" || c.kind === "photo" || c.kind === "tline") Object.keys(l.place).forEach(k => { if(l.place[k] === zone && !l.locked[k]) delete l.place[k]; });
        l.place[id] = zone; delete l.notes[id];
      } else if(zone === "tray") { delete l.place[id]; }
      selId = null; saveLocal(); renderWork(no); setFb("");
  };
  bindDrag(w, {
    onTap: id => {
      if(compact && !l.place[id] && !selId) return;
      if(selId && selId !== id && l.place[id]){ const pick = selId; selId = null; return this_drop(pick, l.place[id]); }
      if(compact && !l.place[id]) return;
      if(l.place[id] && !l.locked[id]){ delete l.place[id]; delete l.notes[id]; selId = null; saveLocal(); renderWork(no); return; }
      selId = selId === id ? null : id; renderWork(no);
      if(selId) setFb("選好紙片了，再點一下要放的位置。", true);
    },
    onDrop: this_drop
  });
  if(compact && !inTray.length) selId = null;
  renderActs(no);
}

function renderOrder(no){
  const c = CH[no], l = L(no), w = $("#work");
  const ids = c.cards.map(k => k.id);
  if(!l.order || l.order.length !== ids.length || l.order.some(id => !ids.includes(id))) l.order = ids.slice(); // 題目改過時重新排
  const byId = {}; c.cards.forEach(k => byId[k.id] = k);
  if(c.timeline){
    const fixed = l.cardsDone, N = l.order.length;
    if(fixed && !l.tlref && !l.tlBusy && API){ l.tlBusy = true; api({ action:"check", set:"c" + no + "tl", written:{} }).then(r => { l.tlBusy = false; l.tlref = r.ok && r.ref ? r.ref : {}; saveLocal(); if(curNo === no) renderOrder(no); }).catch(() => { l.tlBusy = false; }); }
    const tone = i => { const t = N > 1 ? i / (N - 1) : 0, a = [232, 218, 188], b = [255, 251, 242]; return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(",")})`; };
    w.innerHTML = `${fixed ? `<div class="kicker" style="margin-top:6px">正確的時間軸</div>` : `<p class="small muted">由上到下，從最古老排到今天。可以拖拉，或按 ▲▼ 移動。</p>`}
      <div class="tl ${fixed ? "fixed" : ""}"><div class="tl-end">古</div><ol class="order tl-list" id="olist">` + l.order.map((id, i) => `<li data-li="${id}" style="--paper:${tone(i)}"><span class="tl-dot"></span>
        <span class="tl-era">${fixed ? esc((l.tlref || {})[id] || "") : ""}</span>${slipHTML(byId[id], l, no)}
        <span class="mv">${fixed ? "" : `<button data-up="${i}" aria-label="往上">▲</button><button data-dn="${i}" aria-label="往下">▼</button>`}</span></li>`).join("") + `</ol><div class="tl-end">今</div></div>`;
  } else
  w.innerHTML = `<ol class="order" id="olist">` + l.order.map((id, i) => `<li data-li="${id}"><span class="n">${i+1}</span>${slipHTML(byId[id], l, no)}
     <span class="mv">${l.done ? "" : `<button data-up="${i}" aria-label="往上">▲</button><button data-dn="${i}" aria-label="往下">▼</button>`}</span></li>`).join("") + `</ol>`;
  const move = (i, j) => { if(j < 0 || j >= l.order.length) return; const a = l.order.slice(); [a[i], a[j]] = [a[j], a[i]]; l.order = a; l.notes = {}; saveLocal(); renderOrder(no); };
  w.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
  w.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => move(+b.dataset.dn, +b.dataset.dn + 1));
  if(!l.done && !(c.timeline && l.cardsDone)) bindDrag(w, {
    onTap: () => {},
    onMove: () => {},
    onDrop: (id, zone, y) => {
      const lis = [...w.querySelectorAll("li[data-li]")];
      let to = lis.length;
      for(let i = 0; i < lis.length; i++){ const r = lis[i].getBoundingClientRect(); if(y < r.top + r.height / 2){ to = i; break; } }
      const from = l.order.indexOf(id); const a = l.order.slice(); a.splice(from, 1); a.splice(to > from ? to - 1 : to, 0, id);
      l.order = a; l.notes = {}; saveLocal(); renderOrder(no);
    }
  });
  renderActs(no);
}

function setFb(t, good){ const f = $("#fb"); if(f){ f.textContent = t; f.className = "feedback" + (good ? " good" : ""); } }

function renderActs(no){
  const c = CH[no], l = L(no), a = $("#acts");
  if(l.cardsDone){ a.innerHTML = ""; return; }
  const remain = c.kind === "order" ? 0 : c.cards.filter(k => !l.place[k.id]).length;
  a.innerHTML = `<button class="btn brick" id="checkBtn" ${remain || !API ? "disabled" : ""}>交給老師看看</button>
    ${remain ? `<span class="small muted">還有 ${remain} 張紙片沒放</span>` : ""}
    ${l.tries.length && sess.mode !== "challenge" ? `<button class="textlink" id="hintBtn">需要提示嗎？</button>` : ""}
    ${l.tries.length ? `<span class="small muted">第 ${l.tries.length} 次嘗試</span>` : ""}`;
  const hb = $("#hintBtn"); if(hb) hb.onclick = () => { l.hints++; saveLocal(); setFb(hintText(no), true); };
  const cb = $("#checkBtn"); if(cb) cb.onclick = () => doCheck(no);
}
function hintText(no){
  return { 1:"✎ 爸爸的稀飯在第三段；第四段說到阿媽和媽媽都愛的糜（有甜的）；阿媽的拿手鹹糜在第五段。",
           2:"✎ 先想：生病時要喝什麼粥？粥裡加什麼？誰來餵？最後才是到了荷蘭以後。",
           3:"✎ 起＝開頭寫自己喝粥；承＝家裡兩種吃法；轉＝爸媽的共同點和荷蘭；合＝古書和古人。",
           4:"✎ 問自己：這是「一個人」的例子，還是課文清楚寫出來的事？一個人的經驗，不能推到所有人。" }[no];
}

async function doCheck(no){
  const c = CH[no], l = L(no);
  const snap = c.kind === "order" ? l.order.slice() : Object.assign({}, l.place);
  l.tries.push(snap); saveLocal();
  $("#acts").innerHTML = `<span class="pending">老師正在用鉛筆批改……</span>`;
  let r;
  try{ r = await api(c.kind === "order" ? { action:"check", set:"c" + no, order:snap, tryNo:l.tries.length } : { action:"check", set:"c" + no, placements:snap, tryNo:l.tries.length }); }
  catch(e){ r = { ok:false, error:"網路好像斷了，請再按一次。" }; }
  if(!r.ok){ l.tries.pop(); saveLocal(); setFb(r.error || "批改失敗"); renderActs(no); return; }
  if(l.tries.length === 1) l.firstRight = Object.values(r.results).filter(Boolean).length;
  const showPara = sess.mode !== "challenge";
  if(c.kind === "order"){
    l.notes = {};
    Object.keys(r.results).forEach(id => l.notes[id] = r.results[id] ? "✓" : (showPara && r.hints[id] ? `位置不對，再看看${r.hints[id]}` : "位置不對"));
    if(r.reveal){ const ids = c.cards.map(k => k.id); l.order = r.reveal.filter(id => ids.includes(id)); l.notes = {}; l.order.forEach(id => { l.revealed[id] = true; }); }
  } else {
    Object.keys(r.results).forEach(id => {
      if(r.results[id]){ l.locked[id] = true; l.notes[id] = "✓"; }
      else if(r.reveal && r.reveal[id]){ l.place[id] = r.reveal[id]; l.locked[id] = true; l.revealed[id] = true; l.notes[id] = `答案：${r.hints[id] || ""}`; }
      else { delete l.place[id]; l.notes[id] = no === 4 ? (showPara ? `想想：${r.hints[id]}` : "再想想") : (showPara && r.hints[id] ? `再看看${r.hints[id]}` : "再想想"); }
    });
  }
  if(r.allRight || r.reveal){
    l.cardsDone = true; saveLocal();
    stamp(r.allRight ? (l.tries.length === 1 ? "好" : "很好") : "加油");
    if(r.allRight && c.kind === "photo") fireworks();
    setFb(r.allRight ? (l.tries.length === 1 ? "一次就全對了！" : `第 ${l.tries.length} 次全部放對了！`) : "這次老師幫你放好了正確位置，對照一下課文，看看差在哪裡。", true);
  } else {
    const ok = Object.values(r.results).filter(Boolean).length, tot = Object.keys(r.results).length;
    setFb(`對了 ${ok} 張，還有 ${tot - ok} 張要再想想。${l.tries.length === 2 ? "下一次再錯，老師會幫你放好。" : ""}`);
  }
  saveLocal(); renderWork(no); renderAfter(no); renderMast(no);
}

/* 煙火：低彩度手繪色的放射線，約 2.5 秒 */
function fireworks(){
  const cols = ["#b5523b", "#e2bf62", "#8a9a7b", "#d39a86", "#7b5a3c"];
  const box = document.createElement("div"); box.className = "fw";
  for(let n = 0; n < 12; n++){
    const cx = 10 + Math.random() * 80, cy = 10 + Math.random() * 60, col = cols[n % cols.length], rays = 18;
    let g = "";
    for(let i = 0; i < rays; i++){ const a = i / rays * Math.PI * 2, r1 = 8, r2 = 34 + Math.random() * 14; g += `<line x1="${50 + Math.cos(a) * r1}" y1="${50 + Math.sin(a) * r1}" x2="${50 + Math.cos(a) * r2}" y2="${50 + Math.sin(a) * r2}" stroke="${col}" stroke-width="3" stroke-linecap="round"/><circle cx="${50 + Math.cos(a) * (r2 + 5)}" cy="${50 + Math.sin(a) * (r2 + 5)}" r="2" fill="${col}"/>`; }
    box.insertAdjacentHTML("beforeend", `<svg class="burst" viewBox="0 0 100 100" style="left:${cx}%;top:${cy}%;animation-delay:${n * 0.18}s" filter="url(#pencil)">${g}</svg>`);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}

function bindCompare(c, l, no){
  const T = c.tasks, w = l.w = l.w || {};
  const read = () => { document.querySelectorAll("[data-c]").forEach(x => { const k = x.dataset.c;
    if(x.type === "checkbox") w[k] = x.checked ? "1" : ""; else if(x.type === "radio"){ if(x.checked) w[k] = x.value; } else w[k] = x.value.trim(); }); saveLocal(); };
  document.querySelectorAll("[data-c]").forEach(x => x.addEventListener(x.type === "checkbox" || x.type === "radio" ? "change" : "input", read));
  const b = $("#cBtn");
  if(b) b.onclick = async () => {
    read(); const msg = $("#cMsg");
    const any = g => T.t1.items.some(([id]) => w[g + "_" + id]);
    if(!any("t1a") || !any("t1b")){ msg.textContent = "任務一：兩個版本都至少勾一個。"; return; }
    if(["t1_r", "t2_a", "t2_b", "t3_b1", "t3_b2", "t4_r"].some(k => !(w[k] || "")) || !w.t4_pick){ msg.textContent = "每個任務都要完成（勾選、填空、寫理由），再交一次。"; return; }
    const placements = { acul: w.t1a_cul ? "1" : "0", bcul: w.t1b_cul ? "1" : "0", pick: w.t4_pick };
    b.disabled = true;
    let r;
    try{ r = await api({ action:"check", set:"c" + no + "opt", placements, tryNo:(l.tries.length + 1) }); }
    catch(e){ msg.textContent = "網路好像斷了，再按一次。"; b.disabled = false; return; }
    if(!r.ok && r.error !== "沒有這一題"){ msg.textContent = r.error || "批改失敗"; b.disabled = false; return; }
    const R = r.ok ? r.results || {} : { acul:true, bcul:true, pick:true }, H = r.ok ? r.hints || {} : {};
    const fb = l.cfb = {};
    const r1 = T.t1.good.test(w.t1_r);
    fb.t1 = R.acul && R.bcul && r1 ? { good:true, t:"✓ 勾選和理由都對得上課文" } : { good:false, t:!(R.acul && R.bcul) ? "再比較一次兩個版本寫到的內容。" : "理由要回到句子。", h:[!R.acul ? H.acul : "", !R.bcul ? H.bcul : "", !r1 ? T.t1.hint : ""].filter(Boolean).join(" ") };
    ["a", "b"].forEach(k => { const ok = T.t2[k].good.test(w["t2_" + k]); fb["t2_" + k] = ok ? { good:true, t:"✓" } : { good:false, t:"再看看這個版本寫到了哪些人、哪些事。" }; });
    ["b1", "b2"].forEach(k => { const ok = T.t3[k].good.test(w["t3_" + k]); fb["t3_" + k] = ok ? { good:true, t:"✓" } : { good:false, t:"這一格再想想。" }; });
    const r4 = T.t4.good.test(w.t4_r);
    fb.t4 = R.pick && r4 ? { good:true, t:"✓ 你看出這幾段的作用了" } : { good:false, t:!R.pick ? "再想想這個選擇。" : "理由再說清楚一點。", h:[!R.pick ? H.pick : "", !r4 ? T.t4.hint : ""].filter(Boolean).join(" ") };
    l.tries.push(placements);
    const anyBad = Object.values(fb).some(f => !f.good);
    if(anyBad && !l.ctried){ l.ctried = true; l.hints++; saveLocal(); b.disabled = false; renderAfter(no); return; }
    try{
      const rr = await api({ action:"check", set:"c" + no + "w", written:w });
      if(!rr.ok && rr.error === "沒有這一題") l.cref = { note:"（老師還沒放上參考筆記，可以先完成這一話。）" };
      else if(!rr.ok){ msg.textContent = rr.error || "讀取參考筆記失敗"; b.disabled = false; return; }
      else l.cref = rr.ref || { note:"" };
    }catch(e){ msg.textContent = "網路好像斷了，再按一次。"; b.disabled = false; return; }
    if(!anyBad) stamp(l.tries.length === 1 ? "好" : "很好");
    saveLocal(); renderAfter(no);
  };
  const d = $("#cDone"); if(d) d.onclick = () => { read(); finishLevel(no); renderAfter(no); };
}

  if(l.wref && l.wref.note) h += `<p class="note">✎ ${esc(l.wref.note)}</p>`;
  if(!l.done) h += `<div class="feedback" id="wMsg">${l.wtried && !l.wref ? "看看每一題的提醒和提示，改一改再交一次。" : ""}</div><div class="actions">${l.wref ? `<button class="btn solid" id="wDone">看完了，完成第${c.kanji}話</button>` : `<button class="btn brick" id="wBtn">${c.openOnly ? "寫好了，交出去" : l.wtried ? "改好了，看參考筆記" : "寫好了，交給老師看看"}</button>`}</div>`;
  return h;

function bindWrite(c, l, no){
  const read = () => { document.querySelectorAll("[data-w]").forEach(t => l.w[t.dataset.w] = t.value.trim()); saveLocal(); };
  document.querySelectorAll("[data-w]").forEach(t => t.addEventListener("input", read));

        else if(!r.ok){ $("#wMsg").textContent = r.error || "讀取參考筆記失敗"; b.disabled = false; return; }
        else l.wref = r.ref || { note:"" };
      }catch(e){ $("#wMsg").textContent = "網路好像斷了，再按一次。"; b.disabled = false; return; }
      saveLocal(); renderAfter(no); return;
    }
    if(c.qs.some(q => q.frame ? Object.keys(q.blanks).some(b => !(l.w[q.k + "_" + b] || "")) : (l.w[q.k] || "").length < 4)){ $("#wMsg").textContent = "每一題、每一格都寫一點，再交一次。"; return; }
    const res = {};
    c.qs.forEach(q => {
      let ok;
      if(q.frame){ ok = true; Object.keys(q.blanks).forEach(b => { const g = q.blanks[b].good.test(l.w[q.k + "_" + b]); l.wfb[q.k + "_" + b] = g; if(!g) ok = false; });
        l.w[q.k] = q.frame.filter(line => !line.think).map(line => line.map(x => typeof x === "string" ? x : (l.w[q.k + "_" + x.b] || "")).join("")).join(""); }
      else ok = q.good.test(l.w[q.k]);
      res[q.k] = ok ? "1" : "0"; l.wfb[q.k] = ok ? { good:true, t:"✓ 有說到重點" } : { good:false, t:q.bad }; });
    const WT = c.kind === "write" ? l.tries : (l.wtries = l.wtries || []);
    WT.push(res);
    if(c.kind === "write" && WT.length === 1) l.firstRight = Object.values(res).filter(v => v === "1").length;
    const anyBad = Object.values(res).includes("0");
    if(anyBad && !l.wtried){ l.wtried = true; l.hints++; saveLocal(); renderAfter(no); return; }
    b.disabled = true;
    try{
      const r = await api({ action:"check", set:"c" + no + "w", written:l.w });
      if(!r.ok && r.error === "沒有這一題") l.wref = { note:"（老師還沒放上這題的參考筆記，可以先完成這一話。）" };
      else if(!r.ok){ $("#wMsg").textContent = r.error || "讀取參考筆記失敗"; b.disabled = false; return; }
      else l.wref = r.ref || { note:"" };
    }catch(e){ $("#wMsg").textContent = "網路好像斷了，再按一次。"; b.disabled = false; return; }
    if(!anyBad) stamp(WT.length === 1 ? "好" : "很好");
    saveLocal(); renderAfter(no);
  };
  const d = $("#wDone"); if(d) d.onclick = () => { read(); finishLevel(no); renderAfter(no); };
}

/* 卡片完成之後：填空／寫想法／下一話 */
function renderAfter(no){
  const c = CH[no], l = L(no), el = $("#after");
  if(!l.cardsDone){ el.innerHTML = ""; return; }
  let h = "";
  if(no === 1){
    h += `<div class="write"><div class="q">最後一張小便條：</div>
      <div class="q">${esc(c.fill.before)}<input class="line" id="fillIn" maxlength="6" value="${esc(l.fill)}" ${l.fillDone ? "disabled" : ""}>${esc(c.fill.after)}</div>
            <div class="feedback ${l.fillDone ? "good" : ""}" id="fillFb">${l.fillDone ? (l.fillOk ? "✓ 對，甜的、鹹的都喜歡。" : `答案是「${esc(l.fillReveal || "甜鹹")}」：甜的、鹹的都喜歡。`) : ""}</div>
      ${l.fillDone ? "" : `<button class="btn sm" id="fillBtn">寫好了</button>`}</div>`;
  } else if(c.tasks){
    h += compareHTML(c, l);
  } else if(c.qs){
    h += writeHTML(c, l);
  } else {
    const R = c.reflect, dis = l.done || l.refDone ? "disabled" : "";
    h += `<div class="write"><div class="q">${esc(R.q)}</div>` + (R.frame ? (() => { l.refB = l.refB || []; l.refBfb = l.refBfb || [];
      return `<div class="q sframe">${R.frame.map((t, i) => esc(t) + (i < R.blanks.length ? `<input class="line refb" data-b="${i}" maxlength="12" ${dis} value="${esc(l.refB[i] || "")}">` : "")).join("")}</div>` +
        R.blanks.map((b, i) => l.refBfb[i] === false && !l.refDone && !l.done ? `<div class="ihint">✎ 第 ${i + 1} 格：${esc(b.hint)}</div>` : "").join("");
    })() : `<textarea id="refIn" maxlength="300" placeholder="用自己的話寫一兩句" ${dis}>${esc(l.reflect)}</textarea>`) + `
            <div class="feedback good" id="refFb">${l.refNote ? esc(l.refNote) : ""}</div>
      ${l.done || l.refDone ? "" : `<button class="btn sm" id="refBtn">${l.refNote ? "改好了，交出去" : "寫好了"}</button>`}</div>`;
    if(c.deep && l.refDone) h += deepHTML(c, l);
  }
  if(no === 1 && l.fillDone) h += induceHTML(l);
  const finished = no === 1 ? l.vennDone : l.done;
  if(finished){
    h += `<hr class="rule"><div class="actions">${no < NCH ? `<a class="btn solid" href="#ch${no+1}">翻到第${CH[no+1].kanji}話 →</a>` : `<a class="btn solid" href="#report">翻開我的讀書手帖 →</a>`}<a class="btn" href="#">回到目次</a></div>`;
  }
  el.innerHTML = h;
  if(no === 1 && l.fillDone) bindInduce(l);
  if(c.deep && l.refDone) bindDeep(c, l, no);
  if(c.qs) bindWrite(c, l, no);
  if(c.tasks) bindCompare(c, l, no);
  const fb = $("#fillBtn");
  if(fb) fb.onclick = async () => {
    const v = $("#fillIn").value.trim(); if(!v) return;
    l.fill = v; l.fillTries = (l.fillTries || 0) + 1; fb.disabled = true;
    try{
      const r = await api({ action:"check", set:"c1fill", fill:v, tryNo:l.fillTries });
      if(r.fillOk || r.fillReveal){ l.fillOk = !!r.fillOk; l.fillReveal = r.fillReveal; l.fillDone = true; }
      else { $("#fillFb").textContent = `再看看第四段那一句。（提示：${c.fill.hint}）`; fb.disabled = false; }
    }catch(e){ $("#fillFb").textContent = "網路好像斷了，再按一次。"; fb.disabled = false; }
    saveLocal(); if(l.fillDone) renderAfter(1);
  };
  const rb = $("#refBtn");
  document.querySelectorAll(".refb").forEach(x => x.addEventListener("input", () => { l.refB[x.dataset.b] = x.value.trim(); saveLocal(); }));
  if(rb && c.reflect.frame) rb.onclick = () => {
    const R = c.reflect; document.querySelectorAll(".refb").forEach(x => l.refB[x.dataset.b] = x.value.trim());
    if(R.blanks.some((b, i) => !l.refB[i])){ $("#refFb").textContent = "每一格都填一個詞。"; return; }
    l.reflect = R.frame.map((t, i) => t + (i < R.blanks.length ? l.refB[i] : "")).join("");
    l.refBfb = R.blanks.map((b, i) => b.good.some(w => l.refB[i].includes(w)));
    const all = l.refBfb.every(Boolean);
    if(all || l.refNote){ l.refNote = all ? "✎ 寫得很好：由個人走向群體，一碗粥從一個人的記憶，變成大家共同的文化。" : "✎ 交出去了。對照下面的深度思考再想一想：開頭寫誰？最後寫到誰？"; if(c.deep) l.refDone = true; else finishLevel(no); }
    else l.refNote = "✎ 有幾格還可以再想想，看看上面的提示，改一改再交一次。";
    saveLocal(); renderAfter(no);
  };
  else if(rb) rb.onclick = () => {
    const v = $("#refIn").value.trim(); if(!v){ $("#refFb").textContent = "寫一句就好。"; return; }
    l.reflect = v;
    if(!l.refNote){
      const hit = c.reflect.good.filter(w => v.includes(w)).length;
      l.refNote = hit >= 2 ? "✎ 寫得很好，你有連回課文。" : hit === 1 ? `✎ 方向對了，可以再多說一點：${c.reflect.hint}` : `✎ ${c.reflect.hint} 想到了可以改一改，再交一次。`;
      if(hit >= 2){ if(c.deep) l.refDone = true; else finishLevel(no); }
      saveLocal(); renderAfter(no); return;
    }
    if(c.deep) l.refDone = true; else finishLevel(no);
    saveLocal(); renderAfter(no);
  };
}

/* 第一話之二：歸納三任務（學生自己寫 → 提醒 → 參考筆記） */
const IND = {

};
function placedBy(zone){ const c = CH[1], l = L(1); return c.cards.filter(k => l.place[k.id] === zone).map(k => k.t); }
function induceHTML(l){
  const d = l.ind = l.ind || { step:1, t1:{}, tv:{}, tw:{}, ref:{}, fb:{} };
  const ro = n => d.step > n || d.done ? "disabled" : "";
  const fb = (n, k) => { const f = d.fb[n] && d.fb[n][k]; return f ? `<div class="ifb ${f.good ? "good" : ""}">${esc(f.t)}</div>` : ""; };
  let h = `<hr class="rule"><div class="kicker">歸納筆記</div>
    <h2 class="title" style="font-size:clamp(24px,5vw,32px)">從一碗粥，看見一個人的生活</h2>
    <p class="lead">分好碗了。接下來兩個小任務，一步一步往上想。每一題都用自己的話寫。</p>`;
  if(d.step < 2) d.step = 2; // 原本的任務一（描述配對）已拿掉
  // 任務二：雙圓圈比較
  d.tv = d.tv || {}; d.tw = d.tw || {};
  const vf = k => { const f = d.fb.v && d.fb.v[k]; return f ? `<div class="vfb ${f.good ? "good" : ""}">${esc(f.t)}</div>` : ""; };
  const vh = k => d.vtried && !d.ref.v && !(d.fb.v && d.fb.v[k] && d.fb.v[k].good) ? `<div class="ihint">✎ ${esc(IND.vhint[k])}</div>` : "";
  const side = (sd) => IND.vdims.map(([k, lab]) => { const key = sd + "_" + k;
    const f = d.fb.v && d.fb.v[key];
    return `<div class="vrow"><label>${lab}${f && f.good ? ` <span class="vok">✓</span>` : ""}</label><input class="vin" data-t="v" data-k="${key}" maxlength="40" ${ro(2)} value="${esc(d.tv[key] || "")}">${f && !f.good ? vf(key) : ""}${vh(key)}</div>`; }).join("");
  h += `<section class="task"><div class="tno">任務一</div><h3 class="ttl">兩個圓圈：爸爸的稀飯 ✕ 媽媽和阿媽的糜</h3>
    <p class="small">課文裡，阿媽和媽媽的吃法常常寫在一起，阿媽的拿手菜也正是媽媽愛吃的，所以把她們放在同一個圈。<br>
    左右兩邊寫<b>不一樣的地方</b>（稱呼、煮法、吃法、時間季節）；中間寫<b>共通點</b>。</p>
    <div class="venn2">${Art.venn().replace("<svg ", '<svg preserveAspectRatio="none" ')}

      <div class="vcol b"><div class="vtop">媽媽和阿媽的糜</div>${side("b")}</div>
    </div>
    ${d.ref.v ? `<div class="vref"><div class="a"><h4>爸爸的稀飯</h4><ul>${IND.vdims.map(([k,lab]) => `<li>${lab}：${esc(d.ref.v["a_" + k] || "")}</li>`).join("")}</ul></div>
      <div class="m"><h4>共通點</h4><p class="small">${esc(d.ref.v.both || "")}</p></div>
      <div class="b"><h4>媽媽和阿媽的糜</h4><ul>${IND.vdims.map(([k,lab]) => `<li>${lab}：${esc(d.ref.v["b_" + k] || "")}</li>`).join("")}</ul></div></div>
      ${d.ref.v.note ? `<div class="rquote">${esc(d.ref.v.note)}</div>` : ""}` : ""}
    ${d.step === 2 && !d.ref.v ? `<div class="feedback" id="indMsgv">${d.vtried ? "看看每一格的提醒和提示，改一改再交一次。" : ""}</div><button class="btn brick sm" data-go="v">${d.vtried ? "改好了，看參考筆記" : "寫好了，交給老師看看"}</button>` : ""}
    ${d.step === 2 && d.ref.v ? `<button class="btn solid sm" data-next="2">下一個任務 →</button>` : ""}

      ${d.wtried && !d.ref.w && !(d.fb.w && d.fb.w.why && d.fb.w.why.good) ? `<div class="ihint">✎ 找找看：第六段哪一句話，說明了爸媽為什麼對粥的想法不同？爸爸的老家在哪裡？</div>` : ""}</div>

    ${d.step === 3 && !d.ref.w ? `<div class="feedback" id="indMsgw">${d.wtried ? "看看提醒和提示，改一改再交一次。" : ""}</div><button class="btn brick sm" data-go="w">${d.wtried ? "改好了，看參考筆記" : "寫好了，交給老師看看"}</button>` : ""}
  </section>`;
  if(d.ref.w && !d.done) h += `<div class="actions"><button class="btn solid" id="indDone">想好了，完成第一話</button></div>`;

function bindInduce(l){
  const d = l.ind;
  const read = () => { document.querySelectorAll("[data-t]:not([data-t='1'])").forEach(el => { const t = "t" + el.dataset.t; d[t] = d[t] || {}; d[t][el.dataset.k] = el.value.trim(); }); saveLocal(); };
  document.querySelectorAll("[data-t]").forEach(el => el.addEventListener("input", read));
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = async () => {
    read(); const n = b.dataset.go, w = n === "v" ? d.tv : d.tw, msg = $("#indMsg" + n);
    const keys = n === "v" ? IND.vdims.flatMap(([k]) => ["a_" + k, "b_" + k]).concat("both") : ["why"];
    if(keys.some(k => !w[k])){ msg.textContent = n === "v" ? "每一格都寫一點（幾個字就好），再交一次。" : "寫一兩句，再交一次。"; return; }
    d.fb[n] = {};
    if(n === "v"){
      keys.forEach(k => { if(k === "both") return; const hit = IND.vgood[k].some(x => w[k].includes(x));
        d.fb.v[k] = hit ? { good:true, t:"✓" } : { good:false, t:"再回課文找一找" }; });
      const v = w.both, sick = /生病|病|不舒服/.test(v), heart = /煮|心意|愛|疼|照顧|關心|餵|吹涼|孩子|子女|女兒|小孩/.test(v);
      d.fb.v.both = sick && heart ? { good:true, t:"✓ 找到了兩人共同的地方" } : sick ? { good:false, t:"有找到生病的時候，再說說他們都為孩子做了什麼" } : { good:false, t:"共通點不是吃法，想想爸媽在什麼時候做了一樣的事" };
    } else {
      d.fb.w.why = IND.whyGood.test(w.why) ? { good:true, t:"✓ 有說到差異的原因" } : { good:false, t:"你寫的是「哪裡不一樣」，再想想「為什麼」會不一樣" };
    }
    const anyBad = Object.values(d.fb[n]).some(f => !f.good);
    if(anyBad && !d[n + "tried"]){ d[n + "tried"] = true; saveLocal(); renderAfter(1); return; }
    b.disabled = true;
    try{
      const r = await api({ action:"check", set:n === "v" ? "c1venn" : "c1why", written:w });
      if(!r.ok && r.error === "沒有這一題") d.ref[n] = { note:"（老師還沒放上這題的參考筆記，可以先繼續。）" };
      else if(!r.ok){ msg.textContent = r.error || "讀取參考筆記失敗"; b.disabled = false; return; }
      else d.ref[n] = r.ref || { note:"" };
    }catch(e){ msg.textContent = "網路好像斷了，再按一次。"; b.disabled = false; return; }
    saveLocal(); renderAfter(1);
  });
  document.querySelectorAll("[data-next]").forEach(b => b.onclick = () => { read(); d.step = Number(b.dataset.next) + 1; saveLocal(); renderAfter(1); });
  const dn = $("#indDone"); if(dn) dn.onclick = () => { read(); d.done = true; l.vennDone = true; finishLevel(1); renderAfter(1); };
}

/* 深度思考題：寫 → 提醒 → 參考筆記 → 補寫 → 完成 */
function deepHTML(c, l){
  const D = c.deep, ro = l.done ? "disabled" : "";
  let h = `<section class="task"><div class="tno">深度思考</div><h3 class="ttl">作者為什麼這樣安排？</h3>
    <div class="q" style="font-family:var(--serif);font-size:16.5px;margin:6px 0">${esc(D.q)}</div>
    ${l.deepTried && !l.deepRef ? `<ul class="vguide muted">${D.guide.map(g => `<li>${esc(g)}</li>`).join("")}</ul>` : ""}
    <div class="write" style="border-top:0;margin-top:0"><textarea id="deepIn" maxlength="400" ${ro} placeholder="我認為……因為……">${esc(l.deep || "")}</textarea>
    <div class="feedback ${l.deepFb && l.deepFb.good ? "good" : ""}">${l.deepFb ? esc(l.deepFb.t) : ""}</div></div>`;
  if(l.deepRef) h += `<p class="note">✎ 老師的參考筆記：和你寫的比一比，有沒有你沒想到的？可以補寫在上面。</p><div class="rquote">${esc(l.deepRef)}</div>`;
  if(!l.done) h += `<div class="feedback" id="deepMsg"></div><div class="actions">${l.deepRef ? `<button class="btn solid" id="deepDone">補寫好了，完成第${c.kanji}話</button>` : `<button class="btn brick sm" id="deepBtn">${l.deepTried ? "改好了，看參考筆記" : "寫好了，交給老師看看"}</button>`}</div>`;
  return h + `</section>`;
}
function bindDeep(c, l, no){
  const ta = $("#deepIn"); if(!ta) return;
  ta.addEventListener("input", () => { l.deep = ta.value.trim(); saveLocal(); });
  const b = $("#deepBtn");
  if(b) b.onclick = async () => {
    l.deep = ta.value.trim();
    if(l.deep.length < 6){ $("#deepMsg").textContent = "多寫一點，說說你的理由。"; return; }
    const hit = c.deep.good.filter(w => l.deep.includes(w)).length;
    l.deepFb = hit >= 2 ? { good:true, t:"✓ 你有說到寫作安排的效果" } : { good:false, t:"✎ " + c.deep.hint + " 上面的問題可以幫你想。" };
    if(hit < 2 && !l.deepTried){ l.deepTried = true; saveLocal(); renderAfter(no); return; }
    b.disabled = true;
    try{
      const r = await api({ action:"check", set:c.deep.set, written:{ q:l.deep } });
      if(!r.ok && r.error === "沒有這一題") l.deepRef = "（老師還沒放上這題的參考筆記。你可以先完成這一話，之後再回來看看。）";
      else if(!r.ok){ $("#deepMsg").textContent = r.error || "讀取參考筆記失敗"; b.disabled = false; return; }
      else l.deepRef = r.ref && r.ref.q || "（老師還沒設定這題的參考筆記）";
    }catch(e){ $("#deepMsg").textContent = "網路好像斷了，再按一次。"; b.disabled = false; return; }
    saveLocal(); renderAfter(no);
  };
  const dn = $("#deepDone"); if(dn) dn.onclick = () => { l.deep = ta.value.trim(); finishLevel(no); renderAfter(no); };
}

async function finishLevel(no){
  const l = L(no);
  if(!l.done){ l.dur += tOpen ? Math.round((Date.now() - tOpen) / 1000) : 0; tOpen = 0; l.done = true; }
  saveLocal(); renderMast(no);
  await pushSave();
}
/* 把每一話的文字回答整理成「題目：回答」，存進試算表 */
function textsOf(no, l){
  const t = {};
  if(no === 1){
    if(l.fill) t["填空（甜鹹不拘）"] = l.fill;
    const d = l.ind;
    if(d){
      IND.vdims.forEach(([k, lab]) => { if(d.tv && d.tv["a_" + k]) t["雙圓圈 爸爸・" + lab] = d.tv["a_" + k]; if(d.tv && d.tv["b_" + k]) t["雙圓圈 媽媽阿媽・" + lab] = d.tv["b_" + k]; });
      if(d.tv && d.tv.both) t["雙圓圈 共通點"] = d.tv.both;
      if(d.tw && d.tw.why) t["為什麼有差異"] = d.tw.why;
    }
  } else if(CH[no].tasks){ const w = l.w || {}, T = CH[no].tasks, lab = g => T.t1.items.filter(([id]) => w[g + "_" + id]).map(x => x[1]).join("、");
    if(lab("t1a")) t["任務一 版本A"] = lab("t1a"); if(lab("t1b")) t["任務一 版本B"] = lab("t1b"); if(w.t1_r) t["任務一 理由"] = w.t1_r;
    if(w.t2_a) t["任務二 版本A讓我知道"] = w.t2_a; if(w.t2_b) t["任務二 版本B讓我知道"] = w.t2_b;
    if(w.t3_b1 || w.t3_b2) t["任務三 句子"] = T.t3.frame.map(x => x === "b1" || x === "b2" ? (w["t3_" + x] || "＿") : x).join("");
    if(w.t4_pick) t["任務四 選擇"] = (T.t4.opts.find(o => o[0] === w.t4_pick) || [,""])[1]; if(w.t4_r) t["任務四 理由"] = w.t4_r;
  } else if(CH[no].qs){ CH[no].qs.forEach(q => { if(l.w && l.w[q.k]) t[q.q] = l.w[q.k]; }); }
  else { if(l.reflect) t["想法"] = l.reflect; if(l.deep) t["深度思考"] = l.deep; }
  return t;
}
const textsFor = (s, no) => { const l = s.levels && s.levels[no]; if(!l) return {}; return l.texts || textsOf(no, l); };

async function pushSave(){
  if(PREVIEW()) return; // 預覽不存紀錄
  const levels = {};
  Object.keys(sess.levels).forEach(k => { const l = sess.levels[k]; levels[k] = { tries:l.tries, dur:l.dur, done:!!l.done, hints:l.hints, texts: textsOf(Number(k), l) }; });
  const payload = { action:"save", student, session:{ id:sess.id, start:sess.start, levels } };
  try{
    const r = await api(payload);
    if(r.ok){ sess.graded = r.graded || {}; sess.pending = null; }
    else { sess.pending = payload; if(r.error && !r.local) toast(r.error); }
  }catch(e){ sess.pending = payload; }
  saveLocal();
}

  if(!classes.includes(tCls)) tCls = classes[0] || "";
  const rows = tRows(), S = rows.map(x => ({ r:x, s: bestSess(x) })).filter(x => x.s);
  const maxSeat = Math.max(30, ...rows.map(x => Number(x.seat) || 0)), bySeat = {}; S.forEach(x => bySeat[x.r.seat] = doneCount(x.s));
  const colors = ["#5f7055","#b5523b","#7b5a3c","#c9a24a"];
  el.innerHTML = `<div class="sc-h"><h1>以粥養生　閱讀小誌</h1><span class="sub">${esc(tCls)} 班・每 15 秒更新</span><span style="flex:1"></span>
      <select id="scCls" style="font-size:min(1.4vw,2.4vh);padding:.3vh .6vw">${classes.map(c => `<option ${c === tCls ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><a href="#scores" style="font-family:var(--hand);font-size:min(1.4vw,2.4vh);margin-left:1vw">離開</a></div>
    <div class="sc-grid"><div class="sc-box"><h3>讀到哪裡了（每個點＝讀完一話）</h3>
      <div class="seats">${Array.from({ length:maxSeat }, (_, i) => { const k = String(i+1), d = bySeat[k]; return `<div class="${d != null ? "on" : ""}">${i+1}<span class="dots">${[0,1,2,3].map(j => `<i class="${d > j ? "on" : ""}"></i>`).join("")}</span></div>`; }).join("")}</div></div>
    <div class="sc-box"><h3>各話完成人數</h3>${Z.chapters.map((c, i) => { const n = S.filter(x => x.s.levels[c.no] && x.s.levels[c.no].done).length; return `<div class="sc-row"><span>第${c.kanji}話</span><div class="sc-bar"><b style="width:${pct(n, Math.max(1, S.length))}%;background:${colors[i]}"></b></div><span>${n} 人</span></div>`; }).join("")}
      <h3 style="margin-top:3vh">第一次就放對（全班）</h3>${Z.chapters.map((c, i) => { const gs = S.map(x => gOf(x.s, c.no)).filter(Boolean); const p = gs.length ? Math.round(gs.reduce((a,g) => a + g.first / g.total, 0) / gs.length * 100) : 0; return `<div class="sc-row"><span>第${c.kanji}話</span><div class="sc-bar"><b style="width:${p}%;background:${colors[i]}"></b></div><span>${p}%</span></div>`; }).join("")}
    </div></div>`;
  const s = $("#scCls"); if(s) s.onchange = e => { tCls = e.target.value; renderScreen(); };
}

/* ================= 路由 ================= */
async function route(){
  flushTime();
  const h = location.hash || "#";
  clearInterval(scrTimer);
  document.body.classList.toggle("screen", h === "#screen");
  ["#pg-home","#pg-ch","#pg-report","#pg-scores","#pg-screen"].forEach(p => $(p).classList.add("hidden"));
  if(h === "#scores"){ $("#regMask").classList.add("hidden"); $("#pg-scores").classList.remove("hidden"); curNo = 0; return loadTeacher(); }
  if(h === "#screen"){ $("#regMask").classList.add("hidden"); $("#pg-screen").classList.remove("hidden"); renderScreen(); scrTimer = setInterval(renderScreen, 15000); return; }
  const m = h.match(/^#ch(\d+)$/); if(m && !CH[+m[1]]) { location.hash = "#"; return; }
  if(m || h === "#report"){
    if(!student){ afterReg = route; openReg(); $("#pg-home").classList.remove("hidden"); renderHome(); return; }
    await ensureSession();
    if(m){ $("#pg-ch").classList.remove("hidden"); return renderCh(Number(m[1])); }
    $("#pg-report").classList.remove("hidden"); curNo = 0; return renderReport();
  }
  curNo = 0; $("#pg-home").classList.remove("hidden"); renderHome(); renderMast(0);
}
window.addEventListener("hashchange", route);
window.addEventListener("pagehide", flushTime);
document.addEventListener("visibilitychange", () => { if(document.hidden) flushTime(); else if(curNo && !L(curNo).done) tOpen = Date.now(); });
route();
})();
</script>
